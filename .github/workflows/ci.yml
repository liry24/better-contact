name: CI
on:
    push:
    pull_request:
    merge_group:
    workflow_dispatch:
permissions: {}
concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
    cancel-in-progress: ${{ github.event_name != 'push' }}
jobs:
    quality:
        runs-on: ubuntu-latest
        permissions: { contents: read }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp check
            - run: vp run typecheck
            - run: vp run unused
            - run: vp run workspace:check
    build:
        runs-on: ubuntu-latest
        permissions: { contents: read }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
            - run: vp run build
            - run: mkdir artifact && cd packages/better-contact && bun pm pack --destination ../../artifact --ignore-scripts
            - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
              with: { name: 'contact-${{ github.sha }}', path: 'artifact/*.tgz', if-no-files-found: error }
    integration:
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ['22.18.0', '24.21.0']
                version: ['1.7.0', '^1.7.0']
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
              with: { node-version: '${{ matrix.node }}' }
            - run: bun add --dev --exact "better-auth@${{ matrix.version }}" "@better-auth/core@${{ matrix.version }}" "auth@${{ matrix.version }}"
            - run: vp run typecheck
            - run: vp run test:unit
            - run: vp run test:integration
    consumer:
        needs: build
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ['22.18.0', '24.21.0']
                manager: [bun, npm, pnpm]
                version: ['1.7.0', '^1.7.0']
        runs-on: ${{ matrix.os }}
        env:
            CONTACT_PACKAGE_MANAGER: ${{ matrix.manager }}
            CONTACT_BETTER_AUTH_VERSION: ${{ matrix.version }}
            CONTACT_TARBALL: ${{ github.workspace }}/artifact/better-contact-0.0.0.tgz
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: ./.github/actions/setup
              with: { node-version: '${{ matrix.node }}' }
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with: { name: 'contact-${{ github.sha }}', path: artifact }
            - name: Resolve exact packed artifact
              shell: bash
              run: |
                  files=("$GITHUB_WORKSPACE"/artifact/*.tgz)
                  [[ ${#files[@]} == 1 && -f "${files[0]}" ]]
                  echo "CONTACT_TARBALL=${files[0]}" >> "$GITHUB_ENV"
            - run: vp run test:consumer
    runtime:
        needs: build
        permissions: { contents: read }
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest]
                node: ['22.0.0', '22.x']
                version: ['1.7.0', '^1.7.0']
        runs-on: ${{ matrix.os }}
        env:
            CONTACT_BETTER_AUTH_VERSION: ${{ matrix.version }}
            CONTACT_TARBALL: ${{ github.workspace }}/artifact/better-contact-0.0.0.tgz
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            # The library floor is tested without Vite+, native TypeScript or node:sqlite.
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with: { node-version: '${{ matrix.node }}' }
            - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
              with: { name: 'contact-${{ github.sha }}', path: artifact }
            - run: node test/runtime/packed.mjs
    codeql:
        runs-on: ubuntu-latest
        permissions: { contents: read, security-events: write }
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
              with: { persist-credentials: false }
            - uses: github/codeql-action/init@7999b86c43a865dc79d8923397f35af22de63401
              with: { languages: javascript-typescript, build-mode: none }
            - uses: github/codeql-action/analyze@7999b86c43a865dc79d8923397f35af22de63401
    ci-ok:
        if: always()
        needs: [quality, build, integration, consumer, runtime, codeql]
        runs-on: ubuntu-latest
        steps:
            - name: Require every blocking job to succeed
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: jq -e 'all(.[]; .result == "success")' <<< "$NEEDS"
