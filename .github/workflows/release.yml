name: Prepare release PR
# Deliberately manual: initial implementation pushes never create a release, tag, or npm publication.
on:
    workflow_dispatch:
permissions: {}
jobs:
    prepare:
        if: github.ref == 'refs/heads/main' && !github.event.repository.fork
        runs-on: ubuntu-latest
        permissions: { contents: write, pull-requests: write }
        steps:
            - uses: danielroe/uppt/pr@65a86313a63b10a6793de6c4ff8614b18e127a71 # v0.6.10
              with:
                  packages: packages/better-contact
                  token: ${{ secrets.GITHUB_TOKEN }}
            - name: Keep the generated release PR in draft
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GH_REPO: ${{ github.repository }}
              run: |
                  gh pr list --base main --state open --json number,headRefName,isDraft,headRepositoryOwner |
                    jq -r --arg owner "$GITHUB_REPOSITORY_OWNER" '.[] | select(.headRepositoryOwner.login == $owner and (.headRefName | test("^release/v[0-9]+\\.[0-9]+\\.[0-9]+$")) and .isDraft == false) | .number' |
                    while read -r number; do gh pr ready --undo "$number"; done
# Release/tag creation and exact-artifact npm publication must be approved and added separately.
